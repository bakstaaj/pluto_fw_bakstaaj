<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">N0JCG Pluto Firmware API test page screen reference</title>
  <desc id="desc">A branded API test page showing endpoint groups, a health request, and a successful response.</desc>
  <rect width="1280" height="760" fill="#f4f7fa"/>
  <rect width="1280" height="78" fill="#0a1f44"/>
  <text x="56" y="37" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">N0JCG</text>
  <text x="56" y="58" fill="#b9d7e7" font-family="Arial,sans-serif" font-size="13">OPEN RADIO PLATFORM  /  APP BUILDER TOOLS</text>
  <text x="1040" y="47" fill="#00b8d9" font-family="Arial,sans-serif" font-size="13">API TEST PAGE</text>
  <text x="56" y="128" fill="#008fa3" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">N0JCG PLUTO FIRMWARE</text>
  <text x="56" y="166" fill="#0a1f44" font-family="Arial,sans-serif" font-size="34" font-weight="700">API test and diagnostics</text>
  <text x="56" y="195" fill="#536171" font-family="Arial,sans-serif" font-size="16">Confirm connectivity and inspect the documented contract before building an application.</text>
  <rect x="56" y="234" width="310" height="468" rx="8" fill="#0a1f44"/>
  <text x="84" y="278" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Endpoint groups</text>
  <rect x="80" y="304" width="262" height="44" rx="4" fill="#1565c0"/>
  <text x="100" y="332" fill="#fff" font-family="Consolas,monospace" font-size="14">GET  /radio/status</text>
  <text x="100" y="382" fill="#b9d7e7" font-family="Consolas,monospace" font-size="14">POST /radio/audio/start</text>
  <text x="100" y="432" fill="#b9d7e7" font-family="Consolas,monospace" font-size="14">POST /radio/loopback/start</text>
  <text x="100" y="482" fill="#b9d7e7" font-family="Consolas,monospace" font-size="14">POST /radio/tx/start</text>
  <text x="100" y="532" fill="#b9d7e7" font-family="Consolas,monospace" font-size="14">GET  /radio/diagnostics</text>
  <text x="84" y="620" fill="#00b8d9" font-family="Arial,sans-serif" font-size="13" font-weight="700">CONTRACT VERSION</text>
  <text x="84" y="648" fill="#fff" font-family="Consolas,monospace" font-size="17">v0.39-N0JCG.5f</text>
  <rect x="400" y="234" width="824" height="468" rx="8" fill="#fff" stroke="#c7cdd4"/>
  <text x="432" y="278" fill="#0a1f44" font-family="Arial,sans-serif" font-size="18" font-weight="700">GET /radio/status</text>
  <rect x="432" y="302" width="722" height="46" rx="4" fill="#f4f7fa" stroke="#c7cdd4"/>
  <text x="452" y="331" fill="#536171" font-family="Consolas,monospace" font-size="15">http://pluto.local/radio/status</text>
  <rect x="1067" y="302" width="87" height="46" rx="4" fill="#1565c0"/>
  <text x="1088" y="331" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">RUN</text>
  <text x="432" y="392" fill="#168a4a" font-family="Arial,sans-serif" font-size="14" font-weight="700">200 OK  /  Operational</text>
  <rect x="432" y="416" width="722" height="236" rx="4" fill="#2b3440"/>
  <text x="458" y="452" fill="#d9f8fc" font-family="Consolas,monospace" font-size="15">{</text>
  <text x="482" y="482" fill="#fff" font-family="Consolas,monospace" font-size="15">"firmware": "v0.39-N0JCG.5f",</text>
  <text x="482" y="512" fill="#fff" font-family="Consolas,monospace" font-size="15">"radio_state": "ready",</text>
  <text x="482" y="542" fill="#fff" font-family="Consolas,monospace" font-size="15">"iio": "connected",</text>
  <text x="482" y="572" fill="#fff" font-family="Consolas,monospace" font-size="15">"tx_guard": "armed_on_request"</text>
  <text x="458" y="602" fill="#d9f8fc" font-family="Consolas,monospace" font-size="15">}</text>
</svg>
